name: E2E Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - preview

# No secrets and no write access: this workflow runs untrusted PR code.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Playwright E2E
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      # Root postinstall also installs agents/auth dependencies.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Spins up the production-mirroring local stack (built SvelteKit worker
      # + auth-agent, both in workerd) with fresh state, then runs the suite.
      - name: Run e2e tests
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
