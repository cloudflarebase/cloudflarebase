name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - preview

# No secrets and no write access: this workflow runs untrusted PR code.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint and typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Falls back so pull requests from forks, which cannot rely on the
          # repository variable being set for them, still run.
          node-version: ${{ vars.NODE_VERSION || '22' }}

      # Root postinstall also installs every agent's dependencies.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck the web app
        run: npm run check

      # The agents are separate TypeScript projects with their own generated
      # Env types, so they are not covered by the check above. Root
      # postinstall installs all four projects' dependencies.
      - name: Typecheck the auth agent
        run: npx tsc --noEmit
        working-directory: agents/auth

      - name: Unit-test the auth agent
        run: npm run test:unit
        working-directory: agents/auth

      - name: Typecheck the db agent
        run: npx tsc --noEmit
        working-directory: agents/db

      - name: Unit-test the db agent
        run: npm run test:unit
        working-directory: agents/db

      - name: Typecheck the storage agent
        run: npx tsc --noEmit
        working-directory: agents/storage

      - name: Unit-test the storage agent
        run: npm run test:unit
        working-directory: agents/storage

      - name: Typecheck the hosting agent
        run: npx tsc --noEmit
        working-directory: agents/hosting

      - name: Unit-test the hosting agent
        run: npm run test:unit
        working-directory: agents/hosting

      # The CLI is a fifth npm project; the root install does not cover it.
      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Typecheck the CLI
        run: npm run typecheck
        working-directory: cli
