name: Release

# Publishing is tag-driven: pushing auth-v1.2.3 or cli-v1.2.3 releases that
# one package at that exact version. The workflow refuses a tag whose version
# does not match the package.json it points at, so a stale tag cannot publish
# the wrong build.
#
# Publishing uses npm trusted publishing (OIDC): npmjs.com is configured to
# accept publishes from exactly this repository, this workflow file, and the
# `release` environment - no npm token exists anywhere, so there is nothing to
# steal or rotate. After this repository's supply-chain incident, that is the
# point. Required reviewers on the `release` environment make every publish
# wait for an approval click on the exact ref being released.
#
# One-time setup per package on npmjs.com (package settings → Trusted
# Publisher): repository cloudflarebase/cloudflarebase.com, workflow
# release.yaml, environment release. If npm will not accept a trusted
# publisher for a package that has never been published, publish the first
# version locally with `npm publish --access public`, configure the trusted
# publisher, and use this workflow from then on.
#
# Publishes carry npm provenance, attesting the exact commit and workflow that
# built the artifact - verifiable by consumers with `npm audit signatures`.
# Provenance requires the repository to be public; push release tags only
# after open-sourcing.

on:
  push:
    tags:
      - 'auth-v*.*.*'
      - 'cli-v*.*.*'

permissions:
  contents: read
  # npm provenance signs the publish with this workflow's OIDC identity.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to npm
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve package from tag
        id: pkg
        run: |
          TAG='${{ github.ref_name }}'
          case "$TAG" in
            auth-v*) echo "dir=agents/auth" >> "$GITHUB_OUTPUT"; echo "version=${TAG#auth-v}" >> "$GITHUB_OUTPUT" ;;
            cli-v*)  echo "dir=cli"         >> "$GITHUB_OUTPUT"; echo "version=${TAG#cli-v}"  >> "$GITHUB_OUTPUT" ;;
            *) echo "unrecognized tag $TAG" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ steps.pkg.outputs.dir }}

      - name: Verify the tag matches package.json
        run: |
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != '${{ steps.pkg.outputs.version }}' ]; then
            echo "tag says ${{ steps.pkg.outputs.version }} but package.json says $ACTUAL" >&2
            exit 1
          fi
        working-directory: ${{ steps.pkg.outputs.dir }}

      # The full typecheck, not just the publish build: agents/auth's
      # bindings.test-d.ts (the consumer-contract tests) is excluded from the
      # build tsconfig on purpose, so only this step runs it.
      - name: Typecheck
        run: npm run typecheck
        working-directory: ${{ steps.pkg.outputs.dir }}

      # Trusted publishing needs a newer npm CLI than Node 22 bundles.
      - name: Update npm
        run: npm install -g npm@latest

      # prepublishOnly builds dist/ - publish cannot ship a stale build.
      # No token: npm exchanges this workflow's OIDC identity with npmjs.com.
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
